server {
    listen 80;
    server_name localhost;

    # ===== En-têtes de sécurité (APP-SEC-07) =====
    # Hérités par toutes les « location » (aucune ne redéfinit add_header) ; « always » : aussi sur les erreurs.
    server_tokens off;
    # HSTS : pris en compte par le navigateur uniquement en HTTPS (Render termine le TLS en amont).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Caméra : scan des QR codes par le vigile ; micro : échanges vocaux de collaboration.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    # CSP en OBSERVATION (Report-Only) : signale les violations dans la console sans rien bloquer, le temps de
    # valider la liste en production (connexion Google / Firebase, Google Meet et Agenda). À passer en
    # « Content-Security-Policy » une fois la console propre (carte APP-SEC-07).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.googleapis.com https://*.cloudinary.com https://*.firebaseio.com https://api.iconify.design; frame-src https://*.firebaseapp.com https://accounts.google.com https://meet.google.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy des requêtes REST vers Spring Boot (Port 8090)
    location /api/ {
        proxy_pass http://backend:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (SockJS / STOMP pour collaboration & live chat)
    location /api/ws {
        proxy_pass http://backend:8090/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Routage Single Page Application (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend indisponible : page explicite (public/50x.html, copiée dans le build) avec le VRAI code 50x.
    # Avant : la page n'existait pas dans le build → l'utilisateur recevait un 404 « introuvable ».
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
